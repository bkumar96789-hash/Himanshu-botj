<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HIMANSHU BHAI — VIP Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
:root{
  --p1:#38bdf8;--p2:#7dd3fc;
  --p1r:56;--p1g:189;--p1b:248;
  --p2r:125;--p2g:211;--p2b:252;
  --bg-top:#183c66;--bg-mid:#08111f;
}
body{
  font-family:'Inter',sans-serif;font-weight:800;
  background:radial-gradient(circle at top,var(--bg-top) 0%,var(--bg-mid) 45%,#01040b 100%);
  color:#fff;min-height:100vh;overflow-x:hidden;display:flex;justify-content:center;
}
body::before{content:'';position:fixed;width:450px;height:450px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.08);filter:blur(120px);top:-100px;left:-100px;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;width:380px;height:380px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.06);filter:blur(120px);bottom:-120px;right:-120px;z-index:0;pointer-events:none}
#root{width:100%;max-width:430px;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}

/* ── KEYFRAMES ── */
@keyframes ringPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes blink{50%{opacity:.2}}
@keyframes fadeSlideUp{0%{opacity:0;transform:translateY(28px)}100%{opacity:1;transform:translateY(0)}}
@keyframes fadeSlideDown{0%{opacity:0;transform:translateY(-24px)}100%{opacity:1;transform:translateY(0)}}
@keyframes iconPulse{0%,100%{box-shadow:0 0 40px rgba(var(--p1r),var(--p1g),var(--p1b),.25),inset 0 1px 0 rgba(255,255,255,.08)}50%{box-shadow:0 0 70px rgba(var(--p1r),var(--p1g),var(--p1b),.45),inset 0 1px 0 rgba(255,255,255,.12)}}
@keyframes orbFloat{0%,100%{transform:translateY(0) translateX(-50%)}50%{transform:translateY(-20px) translateX(-50%)}}
@keyframes orbFloatR{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes shineSlide{0%,100%{opacity:0;left:10%}50%{opacity:1;left:80%}}
@keyframes spinRing{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes overlayFadeIn{from{opacity:0}to{opacity:1}}
@keyframes overlayFadeOut{from{opacity:1}to{opacity:0}}
@keyframes popupBounce{0%{transform:scale(.6) translateY(40px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
@keyframes popupShrink{to{transform:scale(.85) translateY(20px);opacity:0}}
@keyframes iconDrop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
@keyframes timerDrain{from{width:100%}to{width:0}}
@keyframes particleFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}

/* ══ LOGIN SCREEN v2 ══ */
.ls2-screen{width:100%;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 32px;position:relative;overflow:hidden;background:linear-gradient(175deg,var(--bg-top) 0%,var(--bg-mid) 100%)}
.ls2-bg-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(var(--p1r),var(--p1g),var(--p1b),.04) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--p1r),var(--p1g),var(--p1b),.04) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black,transparent)}
.ls2-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(60px)}
.ls2-orb-1{width:320px;height:320px;top:-80px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(var(--p1r),var(--p1g),var(--p1b),.22),transparent 70%);animation:orbFloat 7s ease-in-out infinite}
.ls2-orb-2{width:180px;height:180px;bottom:60px;left:-30px;background:radial-gradient(circle,rgba(var(--p1r),var(--p1g),var(--p1b),.14),transparent 70%);animation:orbFloatR 9s ease-in-out infinite 1s}
.ls2-orb-3{width:140px;height:140px;bottom:80px;right:-20px;background:radial-gradient(circle,rgba(var(--p2r),var(--p2g),var(--p2b),.12),transparent 70%);animation:orbFloat 8s ease-in-out infinite 3s}
.ls2-header{width:100%;display:flex;flex-direction:column;align-items:center;margin-bottom:24px;position:relative;z-index:1;animation:fadeSlideDown .55s cubic-bezier(.4,0,.2,1) both}
.ls2-badge-row{display:flex;gap:10px;margin-bottom:22px}
.ls2-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.22);font-size:9px;font-weight:900;letter-spacing:2px;color:#00ff88}
.ls2-badge-vip{background:rgba(var(--p1r),var(--p1g),var(--p1b),.1);border-color:rgba(var(--p1r),var(--p1g),var(--p1b),.3);color:var(--p1)}
.ls2-badge-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite;flex-shrink:0}
.ls2-logo{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.ls2-logo-hex{width:62px;height:62px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;filter:drop-shadow(0 0 18px rgba(var(--p1r),var(--p1g),var(--p1b),.6));animation:iconPulse 3s ease-in-out infinite}
.ls2-logo-text{display:flex;flex-direction:column}
.ls2-name{font-size:26px;font-weight:900;letter-spacing:2px;line-height:1;background:linear-gradient(135deg,#fff 0%,var(--p2) 50%,var(--p1) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:5px}
.ls2-dev{font-size:10px;font-weight:700;letter-spacing:1px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.6)}
.ls2-tagline{font-size:9px;font-weight:900;letter-spacing:3.5px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.4)}
.ls2-card{width:100%;position:relative;z-index:1;background:linear-gradient(160deg,rgba(6,12,24,.97),rgba(2,5,12,.99));border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.18);border-radius:28px;padding:0 0 22px;box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 0 80px rgba(var(--p1r),var(--p1g),var(--p1b),.1),0 40px 80px rgba(0,0,0,.9);overflow:hidden;animation:fadeSlideUp .55s .15s cubic-bezier(.4,0,.2,1) both}
.ls2-card-top-bar{width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--p1),var(--p2),var(--p1),transparent);margin-bottom:20px}
.ls2-stats-row{display:flex;align-items:center;justify-content:center;padding:0 20px;margin-bottom:18px}
.ls2-stat{flex:1;text-align:center}
.ls2-stat-val{font-size:20px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,var(--p1),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:4px}
.ls2-stat-lbl{font-size:8px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.3)}
.ls2-stat-div{width:1px;height:36px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.15);margin:0 10px}
.ls2-divider{height:1px;margin:0 20px 20px;background:linear-gradient(90deg,transparent,rgba(var(--p1r),var(--p1g),var(--p1b),.2),transparent)}
.ls2-device-section{padding:0 18px;margin-bottom:18px}
.ls2-device-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ls2-device-icon{width:26px;height:26px;border-radius:8px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.12);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.25);display:flex;align-items:center;justify-content:center;color:var(--p1);flex-shrink:0}
.ls2-device-title{font-size:10px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,.5);flex:1}
.ls2-secure-pill{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.2);font-size:8px;font-weight:900;letter-spacing:1.5px;color:#00ff88}
.ls2-device-id-box{display:flex;align-items:center;gap:10px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.06);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.18);border-radius:16px;padding:14px}
.ls2-device-id{flex:1;font-size:13px;font-weight:900;letter-spacing:2px;color:#fff;font-family:monospace;word-break:break-all;text-shadow:0 0 14px rgba(var(--p1r),var(--p1g),var(--p1b),.5)}
.ls2-copy-btn{width:34px;height:34px;border-radius:10px;flex-shrink:0;background:rgba(var(--p1r),var(--p1g),var(--p1b),.15);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.3);color:var(--p1);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.ls2-copy-btn:active{transform:scale(.92)}
.ls2-status{text-align:center;font-size:11px;font-weight:900;letter-spacing:2px;margin-bottom:14px;min-height:20px;padding:0 18px;transition:all .3s}
.ls2-activate-btn{width:calc(100% - 36px);margin:0 18px 14px;padding:18px;border-radius:18px;border:none;background:linear-gradient(135deg,var(--p1),var(--p2),#fff);font-size:13px;font-weight:900;letter-spacing:3px;color:#020c18;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 8px 30px rgba(var(--p1r),var(--p1g),var(--p1b),.5),0 20px 50px rgba(var(--p1r),var(--p1g),var(--p1b),.2);transition:all .2s;overflow:hidden;position:relative}
.ls2-activate-btn:active{transform:scale(.97)}
.ls2-activate-btn:disabled{opacity:.6;cursor:not-allowed}
.ls2-spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(2,12,24,.3);border-top-color:#020c18;animation:spin 0.7s linear infinite}
.ls2-tg-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px;padding:14px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.07);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.18);border-radius:16px;font-size:10px;font-weight:900;letter-spacing:1.5px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.7);text-decoration:none;transition:all .2s}
.ls2-tg-btn:active{background:rgba(var(--p1r),var(--p1g),var(--p1b),.14);transform:scale(.98)}
.ls2-footer{margin-top:18px;font-size:8px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.15);text-align:center;position:relative;z-index:1}

/* ══ MAIN UI ══ */
.ui-wrapper{width:100%;padding:16px 14px 90px;flex:1}

/* ══ HOME v2 ══ */
.hv2-wrap{display:flex;flex-direction:column}
.hv2-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hv2-topbar-left{display:flex;flex-direction:column}
.hv2-brand{font-size:22px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff,var(--p2),var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.hv2-sub{font-size:9px;font-weight:900;letter-spacing:2.5px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.45);margin-top:3px}
.hv2-live-pill{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:rgba(0,255,136,.07);border:1px solid rgba(0,255,136,.22);font-size:10px;font-weight:900;letter-spacing:2px;color:#00ff88}
.live-dot-g{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:blink 1s infinite;flex-shrink:0}
.hv2-info-row{display:flex;align-items:stretch;background:linear-gradient(135deg,rgba(var(--p1r),var(--p1g),var(--p1b),.07),rgba(var(--p1r),var(--p1g),var(--p1b),.02));border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.15);border-radius:20px;padding:14px 18px;margin-bottom:14px}
.hv2-info-box{flex:1;display:flex;flex-direction:column}
.hv2-info-box-right{align-items:flex-end}
.hv2-info-lbl{display:flex;align-items:center;gap:5px;font-size:8px;font-weight:900;letter-spacing:2px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.5);margin-bottom:6px}
.hv2-info-val{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff}
.hv2-timer{font-variant-numeric:tabular-nums;color:var(--p1);text-shadow:0 0 16px rgba(var(--p1r),var(--p1g),var(--p1b),.6)}
.hv2-info-sep{width:1px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.15);margin:0 18px}
.hv2-pred-card{position:relative;background:linear-gradient(150deg,rgba(6,14,28,.98),rgba(2,5,12,.99));border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.2);border-radius:28px;overflow:hidden;margin-bottom:12px;box-shadow:0 0 60px rgba(var(--p1r),var(--p1g),var(--p1b),.1),0 30px 70px rgba(0,0,0,.8)}
.hv2-pred-glow{position:absolute;width:280px;height:280px;border-radius:50%;top:-100px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(var(--p1r),var(--p1g),var(--p1b),.18) 0%,transparent 70%);pointer-events:none}
.hv2-pred-top-strip{height:3px;background:linear-gradient(90deg,transparent,var(--p1),var(--p2),var(--p1),transparent)}
.hv2-mode-row{display:flex;align-items:center;gap:8px;padding:14px 20px 0}
.hv2-mode-dot{width:8px;height:8px;border-radius:50%;background:var(--p1);box-shadow:0 0 10px rgba(var(--p1r),var(--p1g),var(--p1b),.8);animation:blink 1.4s infinite;flex-shrink:0}
.hv2-mode-text{font-size:9px;font-weight:900;letter-spacing:2px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.6)}
.hv2-pred-body{display:flex;align-items:center;padding:16px 22px;gap:0}
.hv2-pred-left{flex:1;display:flex;flex-direction:column}
.hv2-pred-signal-lbl{font-size:8px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,.3);margin-bottom:8px}
.hv2-pred-result{font-size:42px;font-weight:900;letter-spacing:2px;line-height:1;background:linear-gradient(135deg,#fff,var(--p2),var(--p1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(var(--p1r),var(--p1g),var(--p1b),.5));margin-bottom:10px}
.hv2-pred-period-badge{display:inline-flex;padding:5px 12px;border-radius:999px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.08);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.2);font-size:9px;font-weight:900;letter-spacing:2px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.6)}
.hv2-pred-divline{width:1px;background:linear-gradient(to bottom,transparent,rgba(var(--p1r),var(--p1g),var(--p1b),.25),transparent);margin:0 20px;height:90px;align-self:center}
.hv2-pred-right{display:flex;flex-direction:column;align-items:center}
.hv2-pred-ball{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;background:rgba(var(--p1r),var(--p1g),var(--p1b),.1);border:2px solid rgba(var(--p1r),var(--p1g),var(--p1b),.4);box-shadow:0 0 30px rgba(var(--p1r),var(--p1g),var(--p1b),.3),inset 0 1px 0 rgba(255,255,255,.1);color:var(--p1);animation:iconPulse 3s ease-in-out infinite;margin:6px 0;text-shadow:0 0 20px rgba(var(--p1r),var(--p1g),var(--p1b),.8)}
.hv2-pred-size-hint{font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(var(--p1r),var(--p1g),var(--p1b),.5)}
.hv2-conf-strip{height:4px;background:rgba(255,255,255,.06);margin:0 20px;border-radius:999px;overflow:hidden}
.hv2-conf-strip-inner{height:100%;border-radius:999px;transition:width .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 10px currentColor}
.hv2-conf-label-row{display:flex;justify-content:space-between;padding:8px 20px 16px}
.hv2-zones-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.hv2-zone{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;overflow:hidden;transition:all .3s}
.hv2-zone-bar{position:absolute;top:0;left:0;right:0;height:2px;background:rgba(255,255,255,.1);transition:background .3s}
.hv2-zone-name{font-size:9px;font-weight:900;letter-spacing:1.5px;color:rgba(255,255,255,.4)}
.hv2-zone-pct{font-size:8px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.2)}
.hv2-zone-on-yellow .hv2-zone-name{color:#fbbf24}
.hv2-zone-on-blue .hv2-zone-name{color:var(--p1)}
.hv2-zone-on-green .hv2-zone-name{color:#00ff88}
.hv2-trend-card{background:linear-gradient(145deg,rgba(8,16,32,.97),rgba(3,6,15,.99));border:1px solid rgba(var(--p2r),var(--p2g),var(--p2b),.14);border-radius:24px;padding:18px 16px;margin-bottom:16px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.hv2-trend-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hv2-trend-title{display:flex;align-items:center;font-size:11px;font-weight:900;letter-spacing:2px;color:var(--p1)}
.hv2-trend-time{font-size:9px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,.25);font-variant-numeric:tabular-nums}
.hv2-trend-section-lbl{font-size:8px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,.25);margin-bottom:8px}
.hv2-bubbles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.hv2-bubble{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.hv2-bubble-b{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.3);color:#60a5fa}
.hv2-bubble-s{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171}
.hv2-ratio-bar{height:6px;border-radius:999px;overflow:hidden;display:flex;margin-bottom:5px}
.hv2-ratio-big{background:linear-gradient(90deg,#3b82f6,#60a5fa);height:100%}
.hv2-ratio-small{background:linear-gradient(90deg,#ef4444,#f87171);height:100%}
.hv2-ratio-labels{display:flex;justify-content:space-between;font-size:9px;font-weight:900;letter-spacing:1px;margin-bottom:12px}
.hv2-trend-stats{display:flex;align-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.hv2-tstat{flex:1}
.hv2-tstat-lbl{font-size:8px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.25);margin-bottom:4px}
.hv2-tstat-val{font-size:14px;font-weight:900;letter-spacing:1px}
.hv2-tstat-sep{width:1px;height:36px;background:rgba(255,255,255,.08);margin:0 16px}
.hv2-insight{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.06);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.15);border-radius:12px;font-size:11px;font-weight:600;color:rgba(255,255,255,.55);line-height:1.4}

/* ══ HISTORY v2 ══ */
.hisv2-wrap{display:flex;flex-direction:column}
.hisv2-session-badge{padding:7px 13px;border-radius:12px;background:rgba(var(--p1r),var(--p1g),var(--p1b),.08);border:1px solid rgba(var(--p1r),var(--p1g),var(--p1b),.2);font-size:10px;font-weight:900;letter-spacing:2px;color:var(--p1)}

/* ══ THEME DRAWER ══ */
.theme-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199998}

.popup-size-text{font-size:14px;font-weight:900;letter-spacing:2px}
.popup-win .popup-size-text{color:var(--p1)}
.popup-loss .popup-size-text{color:#ff2b55}
.popup-jackpot .popup-size-text{color:var(--p1)}

.popup-dismiss:active{transform:scale(.97)}
.popup-timer-bar{width:100%;height:2px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:12px}
.popup-timer-fill{height:100%;border-radius:999px;animation:timerDrain 5s linear forwards}
.popup-win .popup-timer-fill{background:linear-gradient(90deg,var(--p1),var(--p2))}

.popup-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:32px}
.particle{position:absolute;animation:particleFall linear forwards}

async function safeCopy(text){

  try{
    const inp=document.createElement("input"); inp.value=text;
    inp.setAttribute("readonly",""); inp.style.cssText="position:fixed;left:-9999px;top:-9999px;opacity:0;font-size:16px;";

const PREDICTION_MAP={0:'SMALL',1:'BIG',2:'SMALL',3:'BIG',4:'SMALL',5:'BIG',6:'BIG',7:'SMALL',8:'BIG',9:'SMALL'};
let lastIssue="", currentActive=null, lossCount=0, winStreak=0;

function analyzeTrend(list){
  const nums=list.slice(0,30).map(x=>parseInt(x.number));
  const sizes=nums.map(n=>n>=5?'BIG':'SMALL');
  const last10=sizes.slice(0,10);
  const bigCount=sizes.filter(s=>s==='BIG').length;
  const smallCount=sizes.length-bigCount;
  const streakVal=sizes[0]; let streakLen=1;
  for(let i=1;i<sizes.length;i++){ if(sizes[i]===streakVal)streakLen++; else break; }
  let pattern='MIXED';
  const isZigzag=last10.every((v,i)=>i===0||v!==last10[i-1]);
  if(isZigzag)pattern='ZIGZAG';
  else if(streakLen>=4)pattern='STREAK';
  else if(bigCount>smallCount*1.5)pattern='BIG DOMINANT';
  else if(smallCount>bigCount*1.5)pattern='SMALL DOMINANT';
  let insight='';
  if(streakLen>=4)insight=`${streakVal} streak ×${streakLen} — reversal likely`;
  else if(isZigzag)insight='Alternating pattern detected';
  else if(bigCount>smallCount)insight=`BIG dominant (${bigCount}/${sizes.length} recent)`;
  else insight=`SMALL dominant (${smallCount}/${sizes.length} recent)`;
  return {last10,bigCount,smallCount,streakVal,streakLen,pattern,insight,switchProb:0,zigzag:0,momentum:''};
}

function generatePrediction(list,period){
  const recent=list.slice(0,15).map(x=>{const n=parseInt(x.number);return{num:n,size:n>=5?'BIG':'SMALL'};});
  let sB=0,sS=0; const latest=recent[0].size;
  for(let i=0;i<recent.length;i++){const w=recent.length-i; if(recent[i].size==='BIG')sB+=w; else sS+=w;}
  let streak=1;
  for(let i=1;i<recent.length;i++){if(recent[i].size===latest)streak++; else break;}
  let mode='QUANTUM AI';
  if(streak>=4){if(latest==='BIG')sS+=50; else sB+=50; mode='STREAK BREAKER';}
  if(recent[0].size!==recent[1].size&&recent[1].size!==recent[2].size&&recent[2].size!==recent[3].size){
    if(recent[0].size==='BIG')sB+=35; else sS+=35; mode='ULTRA ZIGZAG';
  }
  if(lossCount>=2){if(recent[0].size==='BIG')sS+=40; else sB+=40; mode='RECOVERY MODE';}
  if(winStreak>=3){if(recent[0].size==='BIG')sB+=25; else sS+=25; mode='WIN BOOST';}
  const ms=PREDICTION_MAP[recent[0].num];
  if(ms==='BIG')sB+=15; else sS+=15;
  const rawFin=sB>sS?'BIG':'SMALL';
  const tot=sB+sS;
  const conf=tot>0?Math.min(99,Math.max(51,Math.round((Math.max(sB,sS)/tot)*100))):75;
  let fin=rawFin; if(conf<60){fin=rawFin==='BIG'?'SMALL':'BIG'; mode='REVERSE SIGNAL';}
  const pool=fin==='BIG'?[5,6,7,8,9]:[0,1,2,3,4];
  const n1=pool[Math.floor(Math.random()*pool.length)];
  currentActive={period,size:fin,n1};
  return{result:fin,n1,conf,mode:`MODE : ${mode}`};
}

    });
  }
  return `<div class="hisv2-wrap">
  <div class="hv2-topbar">
    <div class="hv2-topbar-left"><div class="hv2-brand">HISTORY</div><div class="hv2-sub">SESSION PERFORMANCE</div></div>
    <div class="hisv2-session-badge">SESSION</div>

    <div class="hisv2-stat-card hisv2-stat-win"><div class="hisv2-stat-icon">✅</div><div class="hisv2-stat-num">${totalWin}</div><div class="hisv2-stat-lbl">WIN</div></div>
    <div class="hisv2-stat-card hisv2-stat-loss"><div class="hisv2-stat-icon">❌</div><div class="hisv2-stat-num">${totalLoss}</div><div class="hisv2-stat-lbl">LOSS</div></div>
    <div class="hisv2-stat-card hisv2-stat-jackpot"><div class="hisv2-stat-icon">🏆</div><div class="hisv2-stat-num">${totalJackpot}</div><div class="hisv2-stat-lbl">JACKPOT</div></div>
  </div>
  <div class="hisv2-wr-card">
    <div class="hisv2-wr-top-bar" style="background:linear-gradient(90deg,${wrColor},transparent)"></div>
    <div class="hisv2-wr-body">
      <div><div class="hisv2-wr-lbl">SESSION WIN RATE</div><div class="hisv2-wr-pct" style="color:${wrColor}">${wr}%</div><div class="hisv2-wr-meta">${totalWin}W · ${totalLoss}L · ${total} ROUNDS</div></div>
      <svg width="72" height="72" viewBox="0 0 72 72">
        <circle cx="36" cy="36" r="28" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="6"/>
        <circle cx="36" cy="36" r="28" fill="none" stroke="${wrColor}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${dash}" transform="rotate(-90 36 36)" style="filter:drop-shadow(0 0 6px ${wrColor})"/>
        <text x="36" y="40" text-anchor="middle" font-size="14" font-weight="900" fill="${wrColor}" font-family="Inter,sans-serif">${wr}%</text>
      </svg>
    </div>
    <div class="hisv2-wr-bar-bg"><div class="hisv2-wr-bar-fill" style="width:${wr}%;background:${wrColor}"></div></div>
  </div>
  <div class="hisv2-list-card">
    <div class="hisv2-list-header">
      <span class="hisv2-list-title"><svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13" style="margin-right:6px"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7V3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>LIVE RESULT HISTORY</span>
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#00ff88;box-shadow:0 0 12px #00ff88;animation:blink 1s infinite"></span>
    </div>
    <div class="hisv2-rows">${rows}</div>
  </div>
</div>`;
}

// ─── ENGINE ───
function startEngine(){
  setInterval(()=>{
    const el=document.getElementById('timer-val');
    if(el){const s=new Date().getSeconds();el.textContent='00:'+String(60-s).padStart(2,'0');}
  },1000);

  async function mainEngine(){
    const list=await fetchWinGoData(); if(!list||list.length===0)return;
    const latest=list[0], issue=latest.issueNumber;
    if(lastIssue!==''&&lastIssue!==issue&&currentActive){
      const num=parseInt(latest.number), actual=num>=5?'BIG':'SMALL', ca=currentActive;
      const jackpot=num===ca.n1, win=actual===ca.size;
      let status;
      if(jackpot){status='JACKPOT';lossCount=0;winStreak++;totalWin++;totalJackpot++;history.unshift({p:issue.slice(-4),num,s:ca.size,status:'JACKPOT'});}
      else if(win){status='WIN';lossCount=0;winStreak++;totalWin++;history.unshift({p:issue.slice(-4),num,s:ca.size,status:'WIN'});}
      else{status='LOSS';lossCount++;winStreak=0;totalLoss++;history.unshift({p:issue.slice(-4),num,s:ca.size,status:'LOSS'});}
      if(history.length>100)history.length=100;
      showResultPopup(status,issue,num,ca.size);
      if(activeView==='history')renderApp();
    }
    lastIssue=issue;
    const nextPrd=(BigInt(issue)+1n).toString();
    if(!currentActive||currentActive.period!==nextPrd){
      const pred=generatePrediction(list,nextPrd);
      predState={...predState,...pred,period:nextPrd.slice(-4)};
      if(activeView==='home')renderApp();
    }
  }

  async function trendEngine(){
    const list=await fetchWinGoData(); if(!list)return;
    predState.trendData=analyzeTrend(list);
    if(activeView==='home')renderApp();
  }

  mainEngine(); trendEngine();
  setInterval(mainEngine,2500);
  setInterval(trendEngine,5000);
}

// ─── BOOT ───
renderApp();
